<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halloweenfesten</title>
<meta name="theme-color" content="#1E1428">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Halloween">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#1E1428; --night2:#2A1D38; --line:#3D2C50;
    --pumpkin:#F28C28; --bone:#EDE6D6; --dim:#A99BB8;
    --moss:#7FA35E; --blood:#C2455A; --amber:#E8C547;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--night);color:var(--bone);font-family:Rubik,system-ui,sans-serif;font-size:16px}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{position:fixed;inset:0;display:flex;flex-direction:column}
  #scroller{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;overflow-anchor:none;padding-bottom:96px}
  header{padding:calc(22px + env(safe-area-inset-top)) 18px 10px;position:relative;overflow:hidden}
  header h1{font-family:Creepster,Rubik,sans-serif;font-weight:400;font-size:44px;line-height:1;margin:0;color:var(--pumpkin);letter-spacing:1px;text-shadow:0 3px 0 #5a2a0a}
  header .sub{color:var(--dim);font-size:14px;margin-top:6px}
  .moon{position:absolute;right:-30px;top:-40px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#f6efd9,#d9cfb3);opacity:.12}
  .sync{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--moss);margin-right:6px;vertical-align:middle}
  .sync.off{background:var(--blood)}
  main{padding:0 14px}
  .stats{display:flex;gap:8px;overflow-x:auto;padding:6px 0 12px;scrollbar-width:none}
  .stat{flex:0 0 auto;background:var(--night2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-width:84px}
  .stat b{display:block;font-size:22px}
  .stat span{font-size:13px;color:var(--dim)}
  .tools{display:flex;gap:8px;margin-bottom:10px}
  .search{flex:1}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;align-items:center}
  .chips .lbl{flex:0 0 auto;font-size:13px;color:var(--dim);margin-right:2px}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;text-decoration:line-through}
  .chip.on{background:var(--bone);color:var(--night);border-color:var(--bone);text-decoration:none}
  .chip.radio{text-decoration:none}
  .row{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line)}
  .row .main{flex:1;min-width:0}
  .row .name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .meta{font-size:13px;color:var(--dim);margin-top:2px}
  .pill{border:none;border-radius:999px;padding:8px 12px;font:inherit;font-size:13px;font-weight:500;min-width:76px}
  .s-ja{background:var(--moss);color:#14200b}
  .s-kanske{background:var(--amber);color:#2a2306}
  .s-nej{background:var(--blood);color:#fff}
  .s-ej{background:var(--line);color:var(--bone)}
  .swish{border:1.5px solid var(--line);background:transparent;color:var(--dim);border-radius:12px;width:44px;height:38px;font-size:18px}
  .swish.on{border-color:var(--moss);background:rgba(127,163,94,.18);color:var(--moss)}
  .check{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:transparent;color:var(--night);font-size:16px;flex:0 0 auto}
  .check.on{background:var(--moss);border-color:var(--moss)}
  .done .name{text-decoration:line-through;color:var(--dim)}
  .edit{background:none;border:none;color:var(--dim);font-size:20px;padding:6px}
  h2{font-size:17px;margin:22px 0 8px;font-weight:700}
  h2 .cnt{font-weight:400;color:var(--dim);font-size:14px}
  .box{background:var(--night2);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
  .kv{display:flex;justify-content:space-between;padding:5px 0}
  .kv.total{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:700}
  .transfer{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
  .transfer:last-child{border-bottom:none}
  .transfer .amt{margin-left:auto;font-weight:700;color:var(--pumpkin)}
  .empty{color:var(--dim);text-align:center;padding:36px 10px;line-height:1.5}
  .fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:none;background:var(--pumpkin);color:#2b1300;font-size:32px;box-shadow:0 6px 18px rgba(242,140,40,.35)}
  nav{flex:0 0 auto;position:relative;background:#170f1f;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
  nav button{flex:1;background:none;border:none;color:var(--dim);font:inherit;font-size:12px;padding:10px 0 12px}
  nav button i{display:block;font-style:normal;font-size:22px;margin-bottom:2px}
  nav button.on{color:var(--pumpkin)}
  .sheetbg{position:fixed;inset:0;background:rgba(10,5,15,.6);display:none;z-index:10}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-height:90vh;overflow-y:auto;overflow-x:hidden;background:var(--night2);border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));z-index:11;transform:translateY(100%);transition:transform .22s ease}
  .sheetbg.open{display:block}
  .sheet.open{transform:none}
  .sheet h3{margin:0 0 14px;font-size:19px}
  label{display:block;font-size:13px;color:var(--dim);margin:12px 0 5px}
  input,select,textarea{width:100%;background:var(--night);border:1px solid var(--line);color:var(--bone);border-radius:12px;padding:13px;font:inherit;font-size:16px}
  input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:50px;text-align:left}
  input[type=date]::-webkit-date-and-time-value{text-align:left}
  textarea{min-height:200px;resize:vertical;line-height:1.4}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pumpkin);outline-offset:1px}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;padding:11px 0;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--bone);font:inherit;font-size:14px}
  .seg button.on{border-color:transparent}
  .btns{display:flex;gap:10px;margin-top:20px}
  .btn{flex:1;border:none;border-radius:14px;padding:15px;font:inherit;font-weight:500;font-size:16px}
  .btn.pri{background:var(--pumpkin);color:#2b1300}
  .btn.sec{background:var(--line);color:var(--bone)}
  .btn.small{flex:0 0 auto;padding:12px 14px;font-size:14px}
  .btn.del{background:transparent;color:var(--blood);flex:0 0 auto;padding:15px 8px}
  .wide{width:100%;margin-bottom:10px}
  .hostrow{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .hostrow span{flex:1}
  .note{font-size:13px;color:var(--dim);line-height:1.45;margin-top:8px}
  .toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--bone);color:var(--night);padding:12px 18px;border-radius:999px;font-weight:500;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
  .toast.show{opacity:1}
  .ptr{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) - 60px);height:60px;opacity:0;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--dim);font-size:14px;z-index:4;pointer-events:none;transition:transform .2s ease}
  .ptr i{font-style:normal;font-size:22px;display:inline-block}
  .ptr.loading i{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.ptr.loading i{animation:none}}
  @media (prefers-reduced-motion:reduce){.sheet,.toast{transition:none}}
</style>
</head>
<body>
<div id="scroller">
<header>
  <div class="moon"></div>
  <h1 id="title">Halloweenfesten</h1>
  <div class="sub"><span class="sync" id="sync"></span><span id="subtext">Laddar...</span></div>
</header>
<main id="view"></main>
</div>
<button class="fab" id="fab" aria-label="Lägg till">+</button>
<nav>
  <button data-tab="guests" class="on"><i>🎃</i>Gäster</button>
  <button data-tab="money"><i>💸</i>Utlägg</button>
  <button data-tab="tasks"><i>🕯️</i>Planering</button>
  <button data-tab="settings"><i>⚙️</i>Inställningar</button>
</nav>
<div class="sheetbg" id="sheetbg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div class="ptr" id="ptr"><i>🎃</i><span>Dra för att ladda om</span></div>

<script>
const DB_URL = 'https://festplanering-8463f-default-rtdb.europe-west1.firebasedatabase.app';
const ROOT = DB_URL.replace(/\/$/, '') + '/hw';
const DEFAULT_CATS = ['Inhandling', 'Förberedelser', 'Aktivitetsförslag'];
const DEFAULTS = {guests:[], expenses:[], tasks:[], settings:{name:'Halloweenfesten', hosts:[], price:0, receiver:'', categories:DEFAULT_CATS, maybeShare:50}};
const STATUS = [
  {k:'ja', label:'Ja', cls:'s-ja'},
  {k:'kanske', label:'Kanske', cls:'s-kanske'},
  {k:'nej', label:'Nej', cls:'s-nej'},
  {k:'ej', label:'Ej svarat', cls:'s-ej'}
];
let state = JSON.parse(JSON.stringify(DEFAULTS));
let tab = 'guests', sheetOpen = false, online = true;
let shown = {ja:true, kanske:true, nej:true, ej:true}, swishFilter = 'alla', query = '';
let taskCat = 'alla';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kr = n => (Math.round(n*100)/100).toLocaleString('sv-SE', {maximumFractionDigits:2}) + ' kr';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const norm = s => String(s).trim().toLowerCase().replace(/\s+/g,' ');

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200);
}

// ---------- database ----------
async function api(path, method='GET', body){
  try{
    const r = await fetch(`${ROOT}${path ? '/'+path : ''}.json`, {
      method, headers:{'Content-Type':'application/json'},
      body: body === undefined ? undefined : JSON.stringify(body)
    });
    if (!r.ok) throw new Error(r.status);
    online = true;
    return await r.json();
  }catch(e){
    online = false;
    return undefined;
  }finally{ updateSync(); }
}
const toList = v => Array.isArray(v) ? v.filter(Boolean) : Object.values(v || {});
function normalize(data){
  data = data || {};
  const s = {...DEFAULTS.settings, ...(data.settings || {})};
  s.hosts = toList(s.hosts);
  s.categories = data.settings && 'categories' in data.settings ? toList(s.categories) : [...DEFAULT_CATS];
  return {guests: toList(data.guests), expenses: toList(data.expenses), tasks: toList(data.tasks), settings: s};
}
function saveItem(coll, item){
  const i = state[coll].findIndex(x => x.id === item.id);
  if (i >= 0) state[coll][i] = item; else state[coll].push(item);
  render();
  return api(`${coll}/${item.id}`, 'PUT', item);
}
function patchItem(coll, id, partial){
  const it = state[coll].find(x => x.id === id);
  if (!it) return;
  Object.assign(it, partial);
  render();
  return api(`${coll}/${id}`, 'PATCH', partial);
}
function deleteItem(coll, id){
  state[coll] = state[coll].filter(x => x.id !== id);
  render();
  return api(`${coll}/${id}`, 'DELETE');
}
async function updateSettings(fn){
  const raw = await api('settings');
  const fresh = normalize({settings: raw === undefined ? state.settings : raw}).settings;
  const next = {...fresh, ...fn(fresh)};
  state.settings = next;
  render();
  await api('settings', 'PUT', next);
}
async function refresh(){
  const data = await api('');
  if (data === undefined) return;
  const next = normalize(data);
  if (JSON.stringify(next) !== JSON.stringify(state)) { state = next; render(); }
}
function updateSync(){ $('#sync').className = 'sync' + (online ? '' : ' off'); }

// ---------- calculations ----------
function guestNumbers(){
  const g = state.guests, price = Number(state.settings.price) || 0;
  const c = st => g.filter(x => x.status === st).length;
  const unpaid = g.filter(x => x.status === 'ja' && !x.paid);
  return {
    ja:c('ja'), kanske:c('kanske'), nej:c('nej'), ej:c('ej'),
    received: g.filter(x => x.paid).length * price,
    expected: c('ja') * price,
    unpaid
  };
}
function settlement(){
  const hosts = state.settings.hosts;
  const total = state.expenses.reduce((a,e) => a + (Number(e.amount)||0), 0);
  const swish = guestNumbers().received;
  const rest = total - swish;
  const share = hosts.length ? rest / hosts.length : 0;
  const balances = hosts.map(h => {
    const paid = state.expenses.filter(e => e.host === h).reduce((a,e) => a + (Number(e.amount)||0), 0);
    const got = state.settings.receiver === h ? swish : 0;
    return {host:h, paid, got, bal: paid - got - share};
  });
  const debtors = balances.filter(b => b.bal < -0.5).map(b => ({...b, left:-b.bal}));
  const creditors = balances.filter(b => b.bal > 0.5).map(b => ({...b, left:b.bal}));
  const transfers = [];
  for (const d of debtors) for (const c of creditors){
    if (d.left < 0.5) break;
    if (c.left < 0.5) continue;
    const amt = Math.min(d.left, c.left);
    transfers.push({from:d.host, to:c.host, amt});
    d.left -= amt; c.left -= amt;
  }
  return {total, swish, rest, share, balances, transfers};
}

function estimate(){
  const s = state.settings, n = guestNumbers();
  const cost = state.tasks.reduce((a,t) => a + (Number(t.est)||0), 0);
  const spent = state.expenses.reduce((a,e) => a + (Number(e.amount)||0), 0);
  const share = Number(s.maybeShare ?? 50);
  const people = n.ja + Math.round(n.kanske * share / 100);
  const exact = people ? cost / people : 0;
  const suggested = Math.ceil(exact / 10) * 10;
  return {cost, spent, share, people, exact, suggested, n};
}
function estimateBox(){
  const e = estimate(), s = state.settings;
  if (!e.cost) return `<div class="box"><b>Uppskattning av inträde</b><p class="note">Lägg in uppskattad kostnad på punkterna i Planering, så räknar appen ut ett förslag på inträde här.</p></div>`;
  const current = Number(s.price) || 0;
  return `<div class="box" id="estBox">
    <b>Uppskattning av inträde</b>
    <div class="kv" style="margin-top:8px"><span>Uppskattad kostnad</span><span>${kr(e.cost)}</span></div>
    <div class="kv"><span>Utlagt hittills</span><span>${kr(e.spent)}</span></div>
    <label for="maybeShare">Andel av Kanske som kommer: <b id="shareLbl">${e.share} %</b></label>
    <input id="maybeShare" type="range" min="0" max="100" step="10" value="${e.share}" style="padding:0">
    <div class="kv"><span>Förväntat antal betalande gäster</span><span>${e.people} st</span></div>
    <div class="kv total"><span>Förslag på inträde</span><span style="color:var(--pumpkin)">${e.people ? kr(e.suggested) : 'Inga gäster än'}</span></div>
    ${e.people ? `<p class="note" style="margin-top:4px">Exakt för att gå jämnt ut: ${kr(e.exact)} per person.${current ? ` Nuvarande swishpris ${kr(current)} ger ${kr(current*e.people)}.` : ''}</p>
    ${e.suggested !== current ? `<button class="btn pri wide" id="usePrice" style="margin:8px 0 0">Använd ${kr(e.suggested)} som swishpris</button>` : ''}` : ''}
  </div>`;
}

// ---------- views ----------
function render(){
  const s = state.settings;
  $('#title').textContent = s.name || 'Halloweenfesten';
  const n = guestNumbers();
  $('#subtext').textContent = `${n.ja} kommer, ${n.kanske} kanske. Uppdateras automatiskt.`;
  $('#fab').style.display = tab === 'settings' ? 'none' : 'block';
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#view').innerHTML = ({guests:viewGuests, money:viewMoney, tasks:viewTasks, settings:viewSettings})[tab]();
}

function filteredGuests(){
  const q = norm(query);
  return [...state.guests]
    .filter(g => shown[g.status || 'ej'])
    .filter(g => swishFilter === 'alla' || (swishFilter === 'ja' ? g.paid : !g.paid))
    .filter(g => !q || norm(g.name).includes(q))
    .sort((a,b) => a.name.localeCompare(b.name,'sv'));
}
function guestListHtml(){
  const list = filteredGuests(), price = Number(state.settings.price) || 0;
  if (!state.guests.length) return `<div class="empty">Inga gäster än. Tryck på Importera för att klistra in en lista, eller på + för att lägga till en i taget.</div>`;
  if (!list.length) return `<div class="empty">Ingen gäst matchar sökningen eller filtret.</div>`;
  return `<div class="note" style="margin:0 0 4px">Visar ${list.length} av ${state.guests.length}</div>` + list.map(g => {
    const st = STATUS.find(x => x.k === g.status) || STATUS[3];
    const meta = g.paid ? 'Swishat' : (g.status === 'ja' && price ? `Ska swisha ${kr(price)}` : '');
    return `<div class="row">
      <div class="main" data-editguest="${g.id}">
        <div class="name">${esc(g.name)}</div>
        ${meta ? `<div class="meta">${meta}</div>` : ''}
      </div>
      <button class="pill ${st.cls}" data-cycle="${g.id}" aria-label="Byt svar">${st.label}</button>
      <button class="swish ${g.paid?'on':''}" data-paid="${g.id}" aria-label="Swishat">${g.paid?'✓':'kr'}</button>
    </div>`;
  }).join('');
}
function viewGuests(){
  const n = guestNumbers();
  return `
    <div class="stats">
      <div class="stat"><b>${n.ja}</b><span>Ja</span></div>
      <div class="stat"><b>${n.kanske}</b><span>Kanske</span></div>
      <div class="stat"><b>${n.nej}</b><span>Nej</span></div>
      <div class="stat"><b>${n.ej}</b><span>Ej svarat</span></div>
      <div class="stat"><b>${kr(n.received)}</b><span>av ${kr(n.expected)} swishat</span></div>
    </div>
    ${n.unpaid.length ? `<button class="btn sec wide" id="copyUnpaid">Kopiera namn som inte swishat (${n.unpaid.length})</button>` : ''}
    <div class="tools">
      <input class="search" id="search" type="search" placeholder="Sök gäst" value="${esc(query)}" autocomplete="off">
      <button class="btn sec small" id="import">Importera</button>
    </div>
    <div class="chips"><span class="lbl">Visa:</span>${STATUS.map(s => `<button class="chip ${shown[s.k]?'on':''}" data-show="${s.k}">${s.label}</button>`).join('')}</div>
    <div class="chips"><span class="lbl">Swish:</span>${[['alla','Alla'],['nej','Ej swishat'],['ja','Swishat']].map(([k,l]) => `<button class="chip radio ${swishFilter===k?'on':''}" data-swf="${k}">${l}</button>`).join('')}</div>
    <div id="glist">${guestListHtml()}</div>
    <p class="note">Tryck på svaret för att byta mellan Ja, Kanske, Nej och Ej svarat. Tryck på namnet för att redigera.</p>`;
}

function viewMoney(){
  const s = settlement(), hosts = state.settings.hosts;
  if (!hosts.length) return estimateBox() + `<div class="empty">Lägg till värdarna under Inställningar för att se utlägg och vem som swishar vem.</div>`;
  const needsReceiver = s.swish > 0 && !hosts.includes(state.settings.receiver);
  return estimateBox() + `
    <h2>Utlägg</h2>
    <div class="box">
      <div class="kv"><span>Totala utlägg</span><span>${kr(s.total)}</span></div>
      <div class="kv"><span>Swish från gäster</span><span>- ${kr(s.swish)}</span></div>
      <div class="kv total"><span>Kvar att dela</span><span>${kr(s.rest)}</span></div>
      <div class="kv"><span>Per värd (${hosts.length} st)</span><span>${kr(s.share)}</span></div>
    </div>
    ${needsReceiver ? `<p class="note" style="color:var(--amber)">Välj vem som tar emot swishen under Inställningar, annars blir uträkningen fel.</p>` : ''}
    <h2>Vem swishar vem</h2>
    <div class="box">${s.transfers.length ? s.transfers.map(t => `<div class="transfer"><span>${esc(t.from)}</span><span style="color:var(--dim)">swishar till</span><span>${esc(t.to)}</span><span class="amt">${kr(t.amt)}</span></div>`).join('') : '<div class="note" style="margin:0">Allt är jämnt, ingen behöver swisha någon.</div>'}</div>
    ${hosts.map(h => {
      const items = state.expenses.filter(e => e.host === h);
      const b = s.balances.find(x => x.host === h);
      return `<h2>${esc(h)} <span class="cnt">lagt ut ${kr(b.paid)}${b.got?`, fått in ${kr(b.got)} swish`:''}</span></h2>
      ${items.length ? items.map(e => `<div class="row"><div class="main" data-editexp="${e.id}"><div class="name">${esc(e.what)}</div></div><div>${kr(Number(e.amount)||0)}</div><button class="edit" data-editexp="${e.id}" aria-label="Redigera">✎</button></div>`).join('') : '<div class="note">Inga utlägg.</div>'}`;
    }).join('')}`;
}

function taskGroups(){
  const cats = state.settings.categories;
  const used = [...new Set(state.tasks.map(t => t.category || ''))];
  const order = [...cats, ...used.filter(c => c && !cats.includes(c))];
  if (used.includes('')) order.push('');
  return order;
}
function viewTasks(){
  const groups = taskGroups();
  const fmt = d => d ? new Date(d+'T12:00').toLocaleDateString('sv-SE',{weekday:'short',day:'numeric',month:'short'}) : '';
  const chipCats = groups.filter(c => c);
  const visible = taskCat === 'alla' ? groups : groups.filter(c => c === taskCat);
  const left = state.tasks.filter(t => !t.done).length;
  let html = `
    <div class="stats"><div class="stat"><b>${left}</b><span>kvar</span></div><div class="stat"><b>${state.tasks.length-left}</b><span>klara</span></div></div>
    <div class="chips"><button class="chip radio ${taskCat==='alla'?'on':''}" data-cat="alla">Alla</button>${chipCats.map(c => `<button class="chip radio ${taskCat===c?'on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
  if (!state.tasks.length && !chipCats.length) return html + `<div class="empty">Inga punkter än. Tryck på + för att lägga till.</div>`;
  for (const cat of visible){
    const items = state.tasks.filter(t => (t.category || '') === cat)
      .sort((a,b) => (a.done-b.done) || (a.due||'9999').localeCompare(b.due||'9999') || a.title.localeCompare(b.title,'sv'));
    const open = items.filter(t => !t.done).length;
    const est = items.reduce((a,t) => a + (Number(t.est)||0), 0);
    html += `<h2>${esc(cat || 'Övrigt')} <span class="cnt">${items.length ? `${open} kvar av ${items.length}` : ''}${est ? `, ca ${kr(est)}` : ''}</span></h2>`;
    html += items.length ? items.map(t => `<div class="row ${t.done?'done':''}">
      <button class="check ${t.done?'on':''}" data-done="${t.id}" aria-label="Klar">${t.done?'✓':''}</button>
      <div class="main" data-edittask="${t.id}">
        <div class="name">${esc(t.title)}</div>
        <div class="meta">${[t.owner ? esc(t.owner) : '', fmt(t.due), t.est ? `ca ${kr(Number(t.est))}` : '', t.note ? esc(t.note) : ''].filter(Boolean).join(', ') || 'Ingen ansvarig'}</div>
      </div>
      <button class="edit" data-edittask="${t.id}" aria-label="Redigera">✎</button>
    </div>`).join('') : `<button class="btn sec wide" data-addincat="${esc(cat)}">Lägg till i ${esc(cat)}</button>`;
  }
  return html;
}

// Import: one name per line. A line like "Kommer" or "Kanske:" sets the answer for the lines below it.
// "Namn; ja" on a single line also works.
const STATUS_WORDS = {
  ja:'ja', kommer:'ja', 'tackat ja':'ja', going:'ja',
  kanske:'kanske', maybe:'kanske', intresserad:'kanske', intresserade:'kanske',
  nej:'nej', 'kan inte':'nej', 'kan inte komma':'nej', 'tackat nej':'nej', "can't go":'nej',
  ej:'ej', 'ej svarat':'ej', inbjuden:'ej', inbjudna:'ej', invited:'ej'
};
function parseImport(text){
  let current = 'ej';
  const out = new Map();
  for (let line of text.split('\n')){
    line = line.replace(/^[\s\-*•\d.)]+/, '').trim();
    if (!line) continue;
    const header = STATUS_WORDS[norm(line.replace(/[:()\d]/g,''))];
    if (header){ current = header; continue; }
    let name = line, st = current;
    const m = line.match(/^(.*?)\s*[;\t]\s*(.+)$/);
    if (m && STATUS_WORDS[norm(m[2])]){ name = m[1].trim(); st = STATUS_WORDS[norm(m[2])]; }
    if (!name) continue;
    const key = norm(name);
    const prev = out.get(key);
    if (prev && prev.status !== 'ej' && st === 'ej') continue; // don't downgrade within one import
    out.set(key, {name, status: st});
  }
  return [...out.values()];
}
function importSheet(){
  openSheet(`
    <h3>Importera gäster</h3>
    <p class="note" style="margin-top:0">Ett namn per rad. Skriv Kommer, Kanske, Kan inte eller Inbjudna på en egen rad, så får namnen under den det svaret. Finns gästen redan uppdateras bara svaret, swish rörs inte.</p>
    <textarea id="impText" placeholder="Kommer&#10;Anna Andersson&#10;Erik Berg&#10;Kanske&#10;Sara Lind"></textarea>
    <div class="btns"><button class="btn sec" id="cancel">Avbryt</button><button class="btn pri" id="ok">Importera</button></div>
  `, () => {
    $('#cancel').onclick = closeSheet;
    $('#ok').onclick = async () => {
      const rows = parseImport($('#impText').value);
      if (!rows.length) return $('#impText').focus();
      const byName = new Map(state.guests.map(g => [norm(g.name), g]));
      const patch = {}; let added = 0, updated = 0;
      for (const r of rows){
        const ex = byName.get(norm(r.name));
        if (ex){
          if (ex.status !== r.status){ ex.status = r.status; patch[ex.id] = ex; updated++; }
        } else {
          const g = {id: uid(), name: r.name, status: r.status, paid: false};
          state.guests.push(g); patch[g.id] = g; added++;
        }
      }
      closeSheet(); render();
      if (Object.keys(patch).length) await api('guests', 'PATCH', patch);
      toast(online ? `${added} nya, ${updated} uppdaterade` : 'Kunde inte spara, kolla anslutningen');
    };
  });
}

function taskSheet(id, presetCat){
  const cats = state.settings.categories;
  const t = state.tasks.find(x => x.id === id) || {title:'', category: presetCat ?? (taskCat !== 'alla' ? taskCat : (cats[0] || '')), owner:'', due:'', note:'', done:false};
  const catOpts = [...new Set([...cats, t.category].filter(Boolean))];
  openSheet(`
    <h3>${id ? 'Redigera punkt' : 'Ny punkt'}</h3>
    <label for="tTitle">Vad</label><input id="tTitle" value="${esc(t.title)}" placeholder="T.ex. Köpa pumpor">
    <label for="tCat">Kategori</label>
    <select id="tCat">${catOpts.map(c => `<option ${t.category===c?'selected':''}>${esc(c)}</option>`).join('')}<option value="" ${!t.category?'selected':''}>Övrigt</option><option value="__new">Ny kategori...</option></select>
    <input id="tNewCat" placeholder="Namn på ny kategori" style="display:none;margin-top:8px">
    <label for="tOwner">Ansvarig</label><select id="tOwner"><option value="">Ingen än</option>${state.settings.hosts.map(h => `<option ${t.owner===h?'selected':''}>${esc(h)}</option>`).join('')}</select>
    <label for="tDue">Klart senast</label><input id="tDue" type="date" value="${esc(t.due)}">
    <label for="tEst">Uppskattad kostnad (kr)</label><input id="tEst" type="number" inputmode="decimal" value="${esc(t.est ?? '')}" placeholder="Valfritt">
    <label for="tNote">Anteckning</label><input id="tNote" value="${esc(t.note)}" placeholder="T.ex. antal, länk, idé">
    ${sheetButtons(id)}
  `, () => {
    if (!id) $('#tTitle').focus();
    $('#tCat').onchange = () => {
      const isNew = $('#tCat').value === '__new';
      $('#tNewCat').style.display = isNew ? 'block' : 'none';
      if (isNew) $('#tNewCat').focus();
    };
    $('#cancel').onclick = closeSheet;
    if (id) $('#del').onclick = () => { closeSheet(); deleteItem('tasks', id); };
    $('#ok').onclick = async () => {
      const title = $('#tTitle').value.trim(); if (!title) return $('#tTitle').focus();
      let category = $('#tCat').value;
      if (category === '__new'){
        category = $('#tNewCat').value.trim();
        if (!category) return $('#tNewCat').focus();
      }
      closeSheet();
      if (category && !state.settings.categories.includes(category))
        await updateSettings(s => ({categories: s.categories.includes(category) ? s.categories : [...s.categories, category]}));
      saveItem('tasks', {id: id || uid(), title, category, owner: $('#tOwner').value, due: $('#tDue').value, note: $('#tNote').value.trim(), est: parseFloat(String($('#tEst').value).replace(',','.')) || 0, done: t.done});
    };
  });
}

async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
    ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  }
}

document.querySelector('nav').onclick = e => {

$('#view').onclick = async e => {
  const d = e.target.closest('[data-show],[data-swf],[data-cat],[data-addincat],[data-cycle],[data-paid],[data-editguest],[data-editexp],[data-edittask],[data-done],[data-delhost],[data-delcat],#saveSettings,#addHost,#addCat,#import,#copyUnpaid,#usePrice');
  if (!d) return;
  const ds = d.dataset;
  if (ds.show){ shown[ds.show] = !shown[ds.show]; render(); }
  else if (ds.swf){ swishFilter = ds.swf; render(); }
  else if (ds.cat){ taskCat = ds.cat; render(); }
  else if ('addincat' in ds) taskSheet(null, ds.addincat);
  else if (ds.cycle){ const g = state.guests.find(x => x.id===ds.cycle); patchItem('guests', ds.cycle, {status: STATUS[(STATUS.findIndex(s=>s.k===g.status)+1)%STATUS.length].k}); }
  else if (ds.paid){ const g = state.guests.find(x => x.id===ds.paid); patchItem('guests', ds.paid, {paid: !g.paid}); }
  else if (ds.editguest) guestSheet(ds.editguest);
  else if (ds.editexp) expenseSheet(ds.editexp);
  else if (ds.edittask) taskSheet(ds.edittask);
  else if (ds.done){ const t = state.tasks.find(x => x.id===ds.done); patchItem('tasks', ds.done, {done: !t.done}); }
  else if (ds.delhost){
    if (confirm(`Ta bort ${ds.delhost} som värd?`)) updateSettings(s => ({hosts: s.hosts.filter(h => h !== ds.delhost), receiver: s.receiver===ds.delhost ? '' : s.receiver}));
  }
  else if (ds.delcat){
    if (confirm(`Ta bort kategorin ${ds.delcat}?`)){
      if (taskCat === ds.delcat) taskCat = 'alla';
      await updateSettings(s => ({categories: s.categories.filter(c => c !== ds.delcat)}));
      const moved = state.tasks.filter(t => t.category === ds.delcat);
      for (const t of moved) patchItem('tasks', t.id, {category: ''});
    }
  }
  else if (d.id === 'addHost'){
    const name = $('#newHost').value.trim(); if (!name) return $('#newHost').focus();
    updateSettings(s => ({hosts: s.hosts.includes(name) ? s.hosts : [...s.hosts, name]}));
  }
  else if (d.id === 'addCat'){
    const name = $('#newCat').value.trim(); if (!name) return $('#newCat').focus();
    updateSettings(s => ({categories: s.categories.includes(name) ? s.categories : [...s.categories, name]}));
  }
  else if (d.id === 'saveSettings'){
    const name = $('#setName').value.trim() || 'Halloweenfesten';
    const price = parseFloat(String($('#setPrice').value).replace(',','.')) || 0;
    const receiver = $('#setRecv').value;
    await updateSettings(() => ({name, price, receiver}));
    toast('Sparat');
  }
  else if (d.id === 'usePrice'){
    const v = estimate().suggested;
    await updateSettings(() => ({price: v}));
    toast(`Swishpriset är nu ${kr(v)}`);
  }
  else if (d.id === 'import') importSheet();
  else if (d.id === 'copyUnpaid'){
    const names = guestNumbers().unpaid.map(g => g.name).sort((a,b) => a.localeCompare(b,'sv'));
    toast(await copyText(names.join(', ')) ? `${names.length} namn kopierade` : 'Kunde inte kopiera');
  }
};

// ---------- pull to refresh (only in the home screen app, the browser has its own) ----------
(() => {
  const standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  if (!standalone) return;
  const scroller = $('#scroller');
  scroller.style.overscrollBehaviorY = 'none';
  const ptr = $('#ptr'), icon = ptr.querySelector('i'), txt = ptr.querySelector('span');
  const LIMIT = 80;
  let startY = null, dy = 0, loading = false;
  const set = d => {
    ptr.style.transition = 'none';
    ptr.style.opacity = Math.min(1, d / 40);
    ptr.style.transform = `translateY(${Math.min(d, LIMIT + 20)}px)`;
    icon.style.transform = `rotate(${d * 3}deg)`;
    txt.textContent = d >= LIMIT ? 'Släpp för att ladda om' : 'Dra för att ladda om';
  };
  const reset = () => { ptr.style.transition = ''; ptr.style.opacity = 0; ptr.style.transform = ''; icon.style.transform = ''; };
  document.addEventListener('touchstart', e => {
    if (loading || sheetOpen || scroller.scrollTop > 0) { startY = null; return; }
    startY = e.touches[0].clientY; dy = 0;
  }, {passive:true});
  document.addEventListener('touchmove', e => {
    if (startY === null) return;
    dy = (e.touches[0].clientY - startY) * 0.5;
    if (dy > 0 && scroller.scrollTop <= 0) set(dy); else { dy = 0; reset(); }
  }, {passive:true});
  document.addEventListener('touchend', async () => {
    if (startY === null) return;
    startY = null;
    if (dy < LIMIT) { reset(); return; }
    loading = true;
    ptr.classList.add('loading'); txt.textContent = 'Laddar om...';
    ptr.style.transition = ''; ptr.style.transform = `translateY(${LIMIT}px)`; icon.style.transform = '';
    // Fetch the page past the cache first, so a newly uploaded version is picked up
    try { await fetch(location.href, {cache:'reload'}); } catch(e) {}
    location.reload();
  });
})();

// ---------- start ----------
(async () => {
  await refresh();
  render();
  if (!state.settings.hosts.length){ tab = 'settings'; render(); }
  const busy = () => sheetOpen || document.hidden || ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);
  setInterval(() => { if (!busy()) refresh(); }, 5000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
})();
</script>
