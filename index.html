<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halloweenfesten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#1E1428; --night2:#2A1D38; --line:#3D2C50;
    --pumpkin:#F28C28; --bone:#EDE6D6; --dim:#A99BB8;
    --moss:#7FA35E; --blood:#C2455A; --amber:#E8C547;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--night);color:var(--bone);font-family:Rubik,system-ui,sans-serif;font-size:16px}
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  header{padding:22px 18px 10px;position:relative;overflow:hidden}
  header h1{font-family:Creepster,Rubik,sans-serif;font-weight:400;font-size:44px;line-height:1;margin:0;color:var(--pumpkin);letter-spacing:1px;text-shadow:0 3px 0 #5a2a0a}
  header .sub{color:var(--dim);font-size:14px;margin-top:6px}
  .moon{position:absolute;right:-30px;top:-40px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#f6efd9,#d9cfb3);opacity:.12}
  .sync{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--moss);margin-right:6px;vertical-align:middle}
  .sync.off{background:var(--blood)}
  main{padding:0 14px}
  .stats{display:flex;gap:8px;overflow-x:auto;padding:6px 0 14px;scrollbar-width:none}
  .stat{flex:0 0 auto;background:var(--night2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-width:84px}
  .stat b{display:block;font-size:22px}
  .stat span{font-size:13px;color:var(--dim)}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--bone);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px}
  .chip.on{background:var(--bone);color:var(--night);border-color:var(--bone)}
  .row{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line)}
  .row .main{flex:1;min-width:0}
  .row .name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .meta{font-size:13px;color:var(--dim);margin-top:2px}
  .pill{border:none;border-radius:999px;padding:8px 12px;font:inherit;font-size:13px;font-weight:500;min-width:76px}
  .s-ja{background:var(--moss);color:#14200b}
  .s-kanske{background:var(--amber);color:#2a2306}
  .s-nej{background:var(--blood);color:#fff}
  .s-ej{background:var(--line);color:var(--bone)}
  .swish{border:1.5px solid var(--line);background:transparent;color:var(--dim);border-radius:12px;width:44px;height:38px;font-size:18px}
  .swish.on{border-color:var(--moss);background:rgba(127,163,94,.18);color:var(--moss)}
  .check{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:transparent;color:var(--night);font-size:16px;flex:0 0 auto}
  .check.on{background:var(--moss);border-color:var(--moss)}
  .done .name{text-decoration:line-through;color:var(--dim)}
  .edit{background:none;border:none;color:var(--dim);font-size:20px;padding:6px}
  h2{font-size:17px;margin:22px 0 8px;font-weight:700}
  .box{background:var(--night2);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
  .kv{display:flex;justify-content:space-between;padding:5px 0}
  .kv.total{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:700}
  .transfer{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
  .transfer:last-child{border-bottom:none}
  .transfer .amt{margin-left:auto;font-weight:700;color:var(--pumpkin)}
  .empty{color:var(--dim);text-align:center;padding:36px 10px;line-height:1.5}
  .fab{position:fixed;right:18px;bottom:calc(92px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:none;background:var(--pumpkin);color:#2b1300;font-size:32px;box-shadow:0 6px 18px rgba(242,140,40,.35)}
  nav{position:fixed;left:0;right:0;bottom:0;background:#170f1f;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
  nav button{flex:1;background:none;border:none;color:var(--dim);font:inherit;font-size:12px;padding:10px 0 12px}
  nav button i{display:block;font-style:normal;font-size:22px;margin-bottom:2px}
  nav button.on{color:var(--pumpkin)}
  .sheetbg{position:fixed;inset:0;background:rgba(10,5,15,.6);display:none;z-index:10}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--night2);border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));z-index:11;transform:translateY(100%);transition:transform .22s ease}
  .sheetbg.open{display:block}
  .sheet.open{transform:none}
  .sheet h3{margin:0 0 14px;font-size:19px}
  label{display:block;font-size:13px;color:var(--dim);margin:12px 0 5px}
  input,select{width:100%;background:var(--night);border:1px solid var(--line);color:var(--bone);border-radius:12px;padding:13px;font:inherit;font-size:16px}
  input:focus,select:focus,button:focus-visible{outline:2px solid var(--pumpkin);outline-offset:1px}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;padding:11px 0;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--bone);font:inherit;font-size:14px}
  .seg button.on{border-color:transparent}
  .btns{display:flex;gap:10px;margin-top:20px}
  .btn{flex:1;border:none;border-radius:14px;padding:15px;font:inherit;font-weight:500;font-size:16px}
  .btn.pri{background:var(--pumpkin);color:#2b1300}
  .btn.sec{background:var(--line);color:var(--bone)}
  .btn.del{background:transparent;color:var(--blood);flex:0 0 auto;padding:15px 8px}
  .hostrow{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .hostrow span{flex:1}
  .note{font-size:13px;color:var(--dim);line-height:1.45;margin-top:8px}
  @media (prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>
</head>
<body>
<header>
  <div class="moon"></div>
  <h1 id="title">Halloweenfesten</h1>
  <div class="sub"><span class="sync" id="sync"></span><span id="subtext">Laddar...</span></div>
</header>
<main id="view"></main>
<button class="fab" id="fab" aria-label="Lägg till">+</button>
<nav>
  <button data-tab="guests" class="on"><i>🎃</i>Gäster</button>
  <button data-tab="money"><i>💸</i>Utlägg</button>
  <button data-tab="tasks"><i>🕯️</i>Att göra</button>
  <button data-tab="settings"><i>⚙️</i>Inställningar</button>
</nav>
<div class="sheetbg" id="sheetbg"></div>
<div class="sheet" id="sheet"></div>

<script>
// ====== KLISTRA IN DIN FIREBASE-URL HÄR ======
const DB_URL = 'https://festplanering-8463f-default-rtdb.europe-west1.firebasedatabase.app';
// =============================================
const ROOT = DB_URL.replace(/\/$/, '') + '/hw';
const KEYS = {guests:1, expenses:1, tasks:1, settings:1};
const DEFAULTS = {guests:[], expenses:[], tasks:[], settings:{name:'Halloweenfesten', hosts:[], price:0, receiver:''}};
const STATUS = [
  {k:'ja', label:'Ja', cls:'s-ja'},
  {k:'kanske', label:'Kanske', cls:'s-kanske'},
  {k:'nej', label:'Nej', cls:'s-nej'},
  {k:'ej', label:'Ej svarat', cls:'s-ej'}
];
let state = JSON.parse(JSON.stringify(DEFAULTS));
let tab = 'guests', guestFilter = 'alla', sheetOpen = false, online = true;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kr = n => (Math.round(n*100)/100).toLocaleString('sv-SE', {maximumFractionDigits:2}) + ' kr';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

// Each guest/expense/task is stored under its own id, so two people editing
// different rows at the same time never overwrite each other.
async function api(path, method='GET', body){
  try{
    const r = await fetch(`${ROOT}/${path}.json`, {
      method, headers:{'Content-Type':'application/json'},
      body: body === undefined ? undefined : JSON.stringify(body)
    });
    if (!r.ok) throw new Error(r.status);
    online = true;
    return await r.json();
  }catch(e){
    online = false;
    return undefined;
  }finally{ updateSync(); }
}
function normalize(data){
  data = data || {};
  const s = {...DEFAULTS.settings, ...(data.settings || {})};
  s.hosts = Array.isArray(s.hosts) ? s.hosts.filter(Boolean) : Object.values(s.hosts || {});
  return {
    guests: Object.values(data.guests || {}),
    expenses: Object.values(data.expenses || {}),
    tasks: Object.values(data.tasks || {}),
    settings: s
  };
}
// Local update first so the UI feels instant, then send to the database
function saveItem(coll, item){
  const i = state[coll].findIndex(x => x.id === item.id);
  if (i >= 0) state[coll][i] = item; else state[coll].push(item);
  render();
  return api(`${coll}/${item.id}`, 'PUT', item);
}
function patchItem(coll, id, partial){
  const it = state[coll].find(x => x.id === id);
  if (!it) return;
  Object.assign(it, partial);
  render();
  return api(`${coll}/${id}`, 'PATCH', partial);
}
function deleteItem(coll, id){
  state[coll] = state[coll].filter(x => x.id !== id);
  render();
  return api(`${coll}/${id}`, 'DELETE');
}
// Settings: read the latest first so a host added by someone else isn't lost
async function updateSettings(fn){
  const fresh = normalize({settings: await api('settings')}).settings;
  const next = {...fresh, ...fn(fresh)};
  state.settings = next;
  render();
  await api('settings', 'PUT', next);
}
async function refresh(){
  const data = await api('');
  if (data === undefined) return;
  const next = normalize(data);
  if (JSON.stringify(next) !== JSON.stringify(state)) { state = next; render(); }
}
function updateSync(){
  $('#sync').className = 'sync' + (online ? '' : ' off');
}

// ---------- calculations ----------
function guestNumbers(){
  const g = state.guests, price = Number(state.settings.price) || 0;
  const sum = st => g.filter(x => x.status === st).reduce((a,x) => a + (Number(x.count)||1), 0);
  const paidPeople = g.filter(x => x.paid).reduce((a,x) => a + (Number(x.count)||1), 0);
  return {
    ja: sum('ja'), kanske: sum('kanske'), nej: sum('nej'), ej: sum('ej'),
    received: paidPeople * price,
    expected: sum('ja') * price,
    unpaidJa: g.filter(x => x.status === 'ja' && !x.paid).length
  };
}
function settlement(){
  const hosts = state.settings.hosts;
  const total = state.expenses.reduce((a,e) => a + (Number(e.amount)||0), 0);
  const swish = guestNumbers().received;
  const rest = total - swish;
  const share = hosts.length ? rest / hosts.length : 0;
  const balances = hosts.map(h => {
    const paid = state.expenses.filter(e => e.host === h).reduce((a,e) => a + (Number(e.amount)||0), 0);
    const got = state.settings.receiver === h ? swish : 0;
    return {host:h, paid, got, bal: paid - got - share};
  });
  // Greedy: those who owe pay those who should get money back
  const debtors = balances.filter(b => b.bal < -0.5).map(b => ({...b, left:-b.bal}));
  const creditors = balances.filter(b => b.bal > 0.5).map(b => ({...b, left:b.bal}));
  const transfers = [];
  for (const d of debtors){
    for (const c of creditors){
      if (d.left < 0.5) break;
      if (c.left < 0.5) continue;
      const amt = Math.min(d.left, c.left);
      transfers.push({from:d.host, to:c.host, amt});
      d.left -= amt; c.left -= amt;
    }
  }
  return {total, swish, rest, share, balances, transfers};
}

// ---------- views ----------
function render(){
  const s = state.settings;
  $('#title').textContent = s.name || 'Halloweenfesten';
  const n = guestNumbers();
  $('#subtext').textContent = `${n.ja} kommer, ${n.kanske} kanske. Uppdateras automatiskt.`;
  $('#fab').style.display = tab === 'settings' ? 'none' : 'block';
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#view').innerHTML = ({guests:viewGuests, money:viewMoney, tasks:viewTasks, settings:viewSettings})[tab]();
}

function viewGuests(){
  const n = guestNumbers();
  const filters = [['alla','Alla'],['ja','Ja'],['kanske','Kanske'],['nej','Nej'],['ej','Ej svarat'],['ejswish','Ej swishat']];
  let list = [...state.guests].sort((a,b) => a.name.localeCompare(b.name,'sv'));
  if (guestFilter === 'ejswish') list = list.filter(g => g.status === 'ja' && !g.paid);
  else if (guestFilter !== 'alla') list = list.filter(g => g.status === guestFilter);
  const price = Number(state.settings.price) || 0;
  return `
    <div class="stats">
      <div class="stat"><b>${n.ja}</b><span>Ja</span></div>
      <div class="stat"><b>${n.kanske}</b><span>Kanske</span></div>
      <div class="stat"><b>${n.nej}</b><span>Nej</span></div>
      <div class="stat"><b>${n.ej}</b><span>Ej svarat</span></div>
      <div class="stat"><b>${kr(n.received)}</b><span>av ${kr(n.expected)} swishat</span></div>
    </div>
    <div class="chips">${filters.map(([k,l]) => `<button class="chip ${guestFilter===k?'on':''}" data-filter="${k}">${l}${k==='ejswish'&&n.unpaidJa?` (${n.unpaidJa})`:''}</button>`).join('')}</div>
    ${list.length ? list.map(g => {
      const st = STATUS.find(x => x.k === g.status) || STATUS[3];
      const c = Number(g.count)||1;
      return `<div class="row">
        <div class="main" data-editguest="${g.id}">
          <div class="name">${esc(g.name)}${c>1?` +${c-1}`:''}</div>
          <div class="meta">${g.paid ? `Swishat ${price?kr(c*price):''}` : (g.status==='ja' && price ? `Ska swisha ${kr(c*price)}` : '')}</div>
        </div>
        <button class="pill ${st.cls}" data-cycle="${g.id}" aria-label="Byt svar">${st.label}</button>
        <button class="swish ${g.paid?'on':''}" data-paid="${g.id}" aria-label="Swishat">${g.paid?'✓':'kr'}</button>
      </div>`;
    }).join('') : `<div class="empty">${state.guests.length ? 'Ingen gäst matchar filtret.' : 'Inga gäster än. Tryck på + för att lägga till dem från Facebook-evenemanget.'}</div>`}
    <p class="note">Tryck på svaret för att byta mellan Ja, Kanske, Nej och Ej svarat. Tryck på namnet för att redigera.</p>`;
}

function viewMoney(){
  const s = settlement(), hosts = state.settings.hosts;
  if (!hosts.length) return `<div class="empty">Lägg först till värdarna under Inställningar.</div>`;
  const byHost = hosts.map(h => ({h, items: state.expenses.filter(e => e.host === h)}));
  const needsReceiver = s.swish > 0 && !hosts.includes(state.settings.receiver);
  return `
    <div class="box">
      <div class="kv"><span>Totala utlägg</span><span>${kr(s.total)}</span></div>
      <div class="kv"><span>Swish från gäster</span><span>− ${kr(s.swish)}</span></div>
      <div class="kv total"><span>Kvar att dela</span><span>${kr(s.rest)}</span></div>
      <div class="kv"><span>Per värd (${hosts.length} st)</span><span>${kr(s.share)}</span></div>
    </div>
    ${needsReceiver ? `<p class="note" style="color:var(--amber)">Välj vem som tar emot swishen under Inställningar, annars blir uträkningen fel.</p>` : ''}
    <h2>Vem swishar vem</h2>
    <div class="box">${s.transfers.length ? s.transfers.map(t => `<div class="transfer"><span>${esc(t.from)}</span><span style="color:var(--dim)">swishar till</span><span>${esc(t.to)}</span><span class="amt">${kr(t.amt)}</span></div>`).join('') : '<div class="note" style="margin:0">Allt är jämnt, ingen behöver swisha någon.</div>'}</div>
    ${byHost.map(({h,items}) => {
      const b = s.balances.find(x => x.host === h);
      return `<h2>${esc(h)} <span style="font-weight:400;color:var(--dim);font-size:14px">lagt ut ${kr(b.paid)}${b.got?`, fått in ${kr(b.got)} swish`:''}</span></h2>
      ${items.length ? items.map(e => `<div class="row"><div class="main" data-editexp="${e.id}"><div class="name">${esc(e.what)}</div></div><div>${kr(Number(e.amount)||0)}</div><button class="edit" data-editexp="${e.id}" aria-label="Redigera">✎</button></div>`).join('') : '<div class="note">Inga utlägg.</div>'}`;
    }).join('')}`;
}

function viewTasks(){
  const list = [...state.tasks].sort((a,b) => (a.done-b.done) || (a.due||'9999').localeCompare(b.due||'9999'));
  const left = state.tasks.filter(t => !t.done).length;
  if (!list.length) return `<div class="empty">Inga uppgifter än. Tryck på + och lägg till t.ex. "Köpa pumpor" eller "Fixa spellista".</div>`;
  const fmt = d => d ? new Date(d+'T12:00').toLocaleDateString('sv-SE',{weekday:'short',day:'numeric',month:'short'}) : '';
  return `<div class="stats"><div class="stat"><b>${left}</b><span>kvar</span></div><div class="stat"><b>${state.tasks.length-left}</b><span>klara</span></div></div>
    ${list.map(t => `<div class="row ${t.done?'done':''}">
      <button class="check ${t.done?'on':''}" data-done="${t.id}" aria-label="Klar">${t.done?'✓':''}</button>
      <div class="main" data-edittask="${t.id}">
        <div class="name">${esc(t.title)}</div>
        <div class="meta">${[t.owner ? esc(t.owner) : 'Ingen ansvarig', fmt(t.due)].filter(Boolean).join(', ')}</div>
      </div>
      <button class="edit" data-edittask="${t.id}" aria-label="Redigera">✎</button>
    </div>`).join('')}`;
}

function viewSettings(){
  const s = state.settings;
  return `
    <div class="box">
      <label for="setName">Festens namn</label>
      <input id="setName" value="${esc(s.name)}">
      <label for="setPrice">Swish per person (kr)</label>
      <input id="setPrice" type="number" inputmode="decimal" value="${esc(s.price)}">
      <label for="setRecv">Vem tar emot gästernas swish?</label>
      <select id="setRecv"><option value="">Välj värd</option>${s.hosts.map(h => `<option ${s.receiver===h?'selected':''}>${esc(h)}</option>`).join('')}</select>
      <div class="btns"><button class="btn pri" id="saveSettings">Spara</button></div>
    </div>
    <h2>Värdar</h2>
    <div class="box">
      ${s.hosts.map(h => `<div class="hostrow"><span>${esc(h)}</span><button class="btn del" data-delhost="${esc(h)}">Ta bort</button></div>`).join('') || '<div class="note" style="margin:0">Inga värdar än.</div>'}
      <label for="newHost">Lägg till värd</label>
      <div style="display:flex;gap:8px"><input id="newHost" placeholder="Namn"><button class="btn pri" style="flex:0 0 auto" id="addHost">Lägg till</button></div>
    </div>
    <p class="note">All data delas med alla som har länken. Rött i hörnet uppe till vänster betyder att appen inte når databasen.</p>`;
}

// ---------- sheets ----------
function openSheet(html, onMount){
  $('#sheet').innerHTML = html;
  $('#sheetbg').classList.add('open');
  requestAnimationFrame(() => $('#sheet').classList.add('open'));
  sheetOpen = true;
  onMount && onMount();
}
function closeSheet(){
  $('#sheet').classList.remove('open');
  $('#sheetbg').classList.remove('open');
  sheetOpen = false;
}
$('#sheetbg').onclick = closeSheet;

function guestSheet(id){
  const g = state.guests.find(x => x.id === id) || {name:'', status:'ej', count:1, paid:false};
  let status = g.status;
  openSheet(`
    <h3>${id ? 'Redigera gäst' : 'Ny gäst'}</h3>
    <label for="gName">Namn</label><input id="gName" value="${esc(g.name)}" autocomplete="off">
    <label>Svar</label><div class="seg" id="gStatus">${STATUS.map(s => `<button data-s="${s.k}" class="${s.k===status?'on '+s.cls:''}">${s.label}</button>`).join('')}</div>
    <label for="gCount">Antal personer (inkl. sällskap)</label><input id="gCount" type="number" inputmode="numeric" min="1" value="${g.count||1}">
    <label><input id="gPaid" type="checkbox" ${g.paid?'checked':''} style="width:auto;margin-right:8px">Har swishat</label>
    <div class="btns">${id?'<button class="btn del" id="del">Ta bort</button>':''}<button class="btn sec" id="cancel">Avbryt</button><button class="btn pri" id="ok">Spara</button></div>
  `, () => {
    if (!id) $('#gName').focus();
    $('#gStatus').onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      status = b.dataset.s;
      $('#gStatus').querySelectorAll('button').forEach(x => x.className = x.dataset.s===status ? 'on '+STATUS.find(s=>s.k===status).cls : '');
    };
    $('#cancel').onclick = closeSheet;
    if (id) $('#del').onclick = () => { closeSheet(); deleteItem('guests', id); };
    $('#ok').onclick = () => {
      const name = $('#gName').value.trim(); if (!name) return $('#gName').focus();
      const item = {id: id || uid(), name, status, count: Math.max(1, parseInt($('#gCount').value)||1), paid: $('#gPaid').checked};
      closeSheet();
      saveItem('guests', item);
    };
  });
}

function expenseSheet(id){
  const hosts = state.settings.hosts;
  if (!hosts.length){ tab='settings'; render(); return; }
  const e = state.expenses.find(x => x.id === id) || {host:hosts[0], what:'', amount:''};
  openSheet(`
    <h3>${id ? 'Redigera utlägg' : 'Nytt utlägg'}</h3>
    <label for="eHost">Vem betalade?</label><select id="eHost">${hosts.map(h => `<option ${e.host===h?'selected':''}>${esc(h)}</option>`).join('')}</select>
    <label for="eWhat">Vad</label><input id="eWhat" value="${esc(e.what)}" placeholder="T.ex. dekorationer, bål, snacks">
    <label for="eAmt">Belopp (kr)</label><input id="eAmt" type="number" inputmode="decimal" value="${esc(e.amount)}">
    <div class="btns">${id?'<button class="btn del" id="del">Ta bort</button>':''}<button class="btn sec" id="cancel">Avbryt</button><button class="btn pri" id="ok">Spara</button></div>
  `, () => {
    $('#cancel').onclick = closeSheet;
    if (id) $('#del').onclick = () => { closeSheet(); deleteItem('expenses', id); };
    $('#ok').onclick = () => {
      const what = $('#eWhat').value.trim(), amount = parseFloat(String($('#eAmt').value).replace(',','.'));
      if (!what) return $('#eWhat').focus();
      if (!(amount > 0)) return $('#eAmt').focus();
      const item = {id: id || uid(), host: $('#eHost').value, what, amount};
      closeSheet();
      saveItem('expenses', item);
    };
  });
}

function taskSheet(id){
  const t = state.tasks.find(x => x.id === id) || {title:'', owner:'', due:'', done:false};
  openSheet(`
    <h3>${id ? 'Redigera uppgift' : 'Ny uppgift'}</h3>
    <label for="tTitle">Vad behöver göras?</label><input id="tTitle" value="${esc(t.title)}">
    <label for="tOwner">Ansvarig</label><select id="tOwner"><option value="">Ingen än</option>${state.settings.hosts.map(h => `<option ${t.owner===h?'selected':''}>${esc(h)}</option>`).join('')}</select>
    <label for="tDue">Klart senast</label><input id="tDue" type="date" value="${esc(t.due)}">
    <div class="btns">${id?'<button class="btn del" id="del">Ta bort</button>':''}<button class="btn sec" id="cancel">Avbryt</button><button class="btn pri" id="ok">Spara</button></div>
  `, () => {
    if (!id) $('#tTitle').focus();
    $('#cancel').onclick = closeSheet;
    if (id) $('#del').onclick = () => { closeSheet(); deleteItem('tasks', id); };
    $('#ok').onclick = () => {
      const title = $('#tTitle').value.trim(); if (!title) return $('#tTitle').focus();
      const item = {id: id || uid(), title, owner: $('#tOwner').value, due: $('#tDue').value, done: t.done};
      closeSheet();
      saveItem('tasks', item);
    };
  });
}

// ---------- events ----------
document.querySelector('nav').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  tab = b.dataset.tab; render(); window.scrollTo(0,0);
};
$('#fab').onclick = () => ({guests:guestSheet, money:expenseSheet, tasks:taskSheet})[tab]?.();

$('#view').onclick = e => {
  const d = e.target.closest('[data-filter],[data-cycle],[data-paid],[data-editguest],[data-editexp],[data-edittask],[data-done],[data-delhost],#saveSettings,#addHost');
  if (!d) return;
  const ds = d.dataset;
  if (ds.filter){ guestFilter = ds.filter; render(); }
  else if (ds.cycle){ const g = state.guests.find(x => x.id===ds.cycle); patchItem('guests', ds.cycle, {status: STATUS[(STATUS.findIndex(s=>s.k===g.status)+1)%STATUS.length].k}); }
  else if (ds.paid){ const g = state.guests.find(x => x.id===ds.paid); patchItem('guests', ds.paid, {paid: !g.paid}); }
  else if (ds.editguest) guestSheet(ds.editguest);
  else if (ds.editexp) expenseSheet(ds.editexp);
  else if (ds.edittask) taskSheet(ds.edittask);
  else if (ds.done){ const t = state.tasks.find(x => x.id===ds.done); patchItem('tasks', ds.done, {done: !t.done}); }
  else if (ds.delhost){
    if (confirm(`Ta bort ${ds.delhost} som värd?`)) updateSettings(s => ({hosts: s.hosts.filter(h => h !== ds.delhost), receiver: s.receiver===ds.delhost ? '' : s.receiver}));
  }
  else if (d.id === 'addHost'){
    const name = $('#newHost').value.trim(); if (!name) return $('#newHost').focus();
    updateSettings(s => ({hosts: s.hosts.includes(name) ? s.hosts : [...s.hosts, name]}));
  }
  else if (d.id === 'saveSettings'){
    const name = $('#setName').value.trim() || 'Halloweenfesten';
    const price = parseFloat(String($('#setPrice').value).replace(',','.')) || 0;
    const receiver = $('#setRecv').value;
    updateSettings(() => ({name, price, receiver}));
  }
};

// ---------- start ----------
(async () => {
  if (DB_URL.includes('DITT-PROJEKT')){
    $('#view').innerHTML = '<div class="empty">Databasen är inte kopplad än. Klistra in Firebase-URL:en i DB_URL högst upp i skriptet.</div>';
    $('#subtext').textContent = 'Ej kopplad'; online = false; updateSync(); return;
  }
  await refresh();
  render();
  if (!state.settings.hosts.length){ tab = 'settings'; render(); }
  setInterval(() => { if (!sheetOpen && !document.hidden && document.activeElement?.tagName !== 'INPUT') refresh(); }, 5000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
})();
</script>
</body>
